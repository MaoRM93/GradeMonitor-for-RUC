name: grademonitor
description: "GradeMonitor - 自动查成绩桌面小工具"
publish_to: 'none'
version: 107.0.0+152

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Material Design 3 Icons
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP 客户端
  dio: ^5.7.0

  # WebSocket
  web_socket_channel: ^3.0.2

  # macOS 原生拓展
  tray_manager: ^0.2.4
  window_manager: ^0.4.3

  # 本地通知
  flutter_local_notifications: ^18.0.1

  # JSON 序列化
  json_annotation: ^4.9.0

  # 工具
  intl: ^0.20.2
  package_info_plus: ^10.2.1

  # Markdown 更新日志渲染（flutter_markdown 官方停维后的社区延续版）
  flutter_markdown_plus: ^1.0.12

  # zip 解包（自更新在 Windows 上的静默安装用；macOS 走系统 ditto）
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/app_icon.ico
    - assets/app_icon_tb.png
